name: Собрать APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: |
          npx cap add android
          node scripts/patch-android.js
          node scripts/patch-gradle.js

      - name: Иконка и заставка
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Синхронизировать
        run: npx cap sync android

      - name: Собрать (подписанная версия для RuStore)
        if: env.SIGNING_PASSWORD != ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/karta-kleva.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/karta-kleva.aab

      - name: Собрать (тестовая версия — пароль подписи не задан)
        if: env.SIGNING_PASSWORD == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/karta-kleva.apk

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KIND=$([ -n "$SIGNING_PASSWORD" ] && echo "подписанная версия для RuStore" || echo "тестовая версия")
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/* --title "Карта клёва 1.${BUILD_NUMBER}" --notes "Сборка 1.${BUILD_NUMBER} (${KIND}). karta-kleva.apk — для установки на телефон. karta-kleva.aab (если есть) — для загрузки в RuStore." --latest

      - name: Сохранить сборку в ветку apk
        run: |
          mkdir /tmp/apkbranch && cp out/* /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build 1.${BUILD_NUMBER} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
