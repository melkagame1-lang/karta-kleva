name: Собрать APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: |
          npx cap add android
          node scripts/patch-android.js

      - name: Иконка и заставка
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Синхронизировать
        run: npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: karta-kleva-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Выложить APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk karta-kleva.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest karta-kleva.apk --title "Карта клёва — последняя сборка" --notes "Скачайте karta-kleva.apk и откройте на телефоне Android." --latest

      - name: Сохранить APK в ветку apk
        run: |
          mkdir /tmp/apkbranch && cp karta-kleva.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add karta-kleva.apk
          git commit -qm "APK ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
